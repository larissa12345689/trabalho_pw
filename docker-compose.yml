version: '3.8'

services:
  
  web:
    build: .
    container_name: petshop_php
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html/  
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: petshop_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pet_shop
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: petshop_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db

volumes:
  mysql_data:  